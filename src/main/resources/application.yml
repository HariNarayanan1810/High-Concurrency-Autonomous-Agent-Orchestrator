spring:
  application:
    name: high-concurrency-autonomous-agent-orchestrator
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

orchestrator:
  tasks:
    max-stored-tasks: ${MAX_STORED_TASKS:1000}
