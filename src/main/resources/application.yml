spring:
  application:
    name: high-concurrency-autonomous-agent-orchestrator
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

orchestrator:
  execution:
    enabled: ${TASK_EXECUTION_ENABLED:false}
    timeout: ${TASK_TIMEOUT:30s}
    max-agents: ${MAX_AGENTS_PER_TASK:16}
    retention: ${TASK_RETENTION:1h}
  tasks:
    max-stored-tasks: ${MAX_STORED_TASKS:1000}
